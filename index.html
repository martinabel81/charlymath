/* 6. Mixed Number Kitchen */
function mixedPics(w, n, d, col, crossN){ return valueGs(w*d+n, d, 'pie', {col, cross: crossN || 0}); }
function genMixed(){
  const L = LV();
  const kind = [['read','toImp','read','addMixed','toImp','addMixed'], ['related','relatedMixed','toMixed','subMixed','related','relatedMixed'], ['unrelated','unrelated','borrow','unrelatedMixed','borrow','unrelatedSub']][L][G.i];
  if (kind === 'read'){
    const d = pick([2,3,4,6]), w = rand(1,2), n = rand(1, d-1), cs = `${w} ${n}/${d}`;
    const {opts, a} = fracOpts(cs, [`${n}/${d}`, `${w+1} ${n}/${d}`, `${w} ${d-n}/${d}`, `${w}`, `${n} ${w}/${d}`].filter(x => !/ (\d+)\/\1$/.test(x)));
    return MCQ({text:`How much pie is there? Each pie is cut into ${d} pieces.`, opts, a, fig: () => rowSVG(mixedPics(w, n, d).map(g => ({g}))),
      hint:`<p>Count the whole pies first: ${w}. Then look at the last pie: ${n} of ${d} pieces.</p>`, wrong: i => `Not ${opts[i]}. Whole pies first, then the pieces.`,
      right:`Yes! ${w} whole ${w === 1 ? 'pie' : 'pies'} and ${n}/${d}: ${cs}.`});
  }
  if (kind === 'toImp'){
    const d = pick([2,3,4]), w = rand(1,2), n = rand(1, d-1), tot = w*d+n;
    const q = PADQ({text:`There are ${w} ${n}/${d} pies. How many ${DNAME[d][1]} is that?`, ans: tot, unit:'', nums:false,
      fig: q => rowSVG(valueGs(tot, d, 'pie', {extra:{nums: q.nums ? 'all' : false}}).map(g => ({g}))),
      hints:[`Each whole pie has ${d} ${DNAME[d][1]}.`, `${w} whole ${w === 1 ? 'pie is' : 'pies are'} ${w} × ${d} = ${w*d} ${DNAME[d][1]}. Then add ${n} more.`, `${w*d} + ${n} = ?`],
      onHint: () => { q.nums = true; }, right:`Yes! ${w} ${n}/${d} = ${tot}/${d}: ${tot} ${DNAME[d][1]}.`});
    return q;
  }
  if (kind === 'addMixed'){
    const d = pick([3,4,5,6,8]); let w1 = rand(1,2), n1, n2, w2 = rand(0,1);
    do { n1 = rand(1, d-2); n2 = rand(1, d-1-n1); } while (n1 + n2 >= d);
    const A = `${w1} ${n1}/${d}`, B = w2 ? `${w2} ${n2}/${d}` : `${n2}/${d}`, W = w1+w2, R = n1+n2;
    return FPAD({text:`${A} + ${B} = ?`, ans:[W*d+R, d],
      fig: () => colSVG([{g: rowG(mixedPics(w1, n1, d, PINK)), label:A}, {g: rowG(mixedPics(w2, n2, d, TEAL)), label:B}]),
      hints:[`Add the whole pies: ${w1} + ${w2} = ${W}.`, `Add the pieces: ${n1}/${d} + ${n2}/${d} = ${R}/${d}.`, `Put them together: ${W} and ${R}/${d}.`],
      right:`Yes! ${A} + ${B} = ${W} ${R}/${d}.`});
  }
  if (kind === 'toMixed'){
    const d = pick([2,3,4,5]); let n; do { n = rand(d+1, 3*d-1); } while (n % d === 0);
    return FPAD({text:`Write ${n}/${d} as a mixed number.`, ans:[n, d], form:'mixed', fig: () => rowSVG(valueGs(n, d, 'pie').map(g => ({g}))),
      hints:[`${d}/${d} makes 1 whole pie. How many whole pies are in the picture?`, `${n} = ${Math.floor(n/d)} × ${d} + ${n % d}.`, `So it is ${Math.floor(n/d)} wholes and ${n % d}/${d} left.`],
      right:`Yes! ${n}/${d} = ${fstr(n, d)}.`});
  }
  if (kind === 'subMixed'){
    const d = pick([3,4,5,6,8]), w1 = rand(2,3), w2 = rand(1, w1-1); let n1, n2; do { n1 = rand(2, d-1); n2 = rand(1, n1-1); } while (n2 >= n1);
    const A = `${w1} ${n1}/${d}`, B = `${w2} ${n2}/${d}`;
    return FPAD({text:`${A} − ${B} = ?`, ans:[(w1-w2)*d + n1-n2, d],
      fig: () => rowSVG(mixedPics(w1, n1, d, PINK, w2*d + n2).map(g => ({g}))),
      hints:[`The crossed-out pieces are taken away. Take away the wholes: ${w1} − ${w2} = ${w1-w2}.`, `Take away the pieces: ${n1}/${d} − ${n2}/${d} = ${n1-n2}/${d}.`, `Put them together: ${w1-w2} and ${n1-n2}/${d}.`],
      right:`Yes! ${A} − ${B} = ${fstr((w1-w2)*d + n1-n2, d)}.`});
  }
  if (kind === 'borrow'){
    const d = pick([3,4,5,6,8]), w1 = rand(2,3); let n1, n2; do { n1 = rand(1, d-2); n2 = rand(n1+1, d-1); } while (n2 <= n1);
    const A = `${w1} ${n1}/${d}`, B = `${n2}/${d}`, tot = w1*d + n1 - n2;
    return FPAD({text:`${A} − ${B} = ?`, ans:[tot, d],
      fig: () => rowSVG(mixedPics(w1, n1, d, PINK, n2).map(g => ({g}))),
      hints:[`There are only ${n1}/${d} pieces, but we take away ${n2}/${d}. Cut one whole pie into ${d}/${d}: ${A} = ${w1-1} ${d+n1}/${d}.`, `Now take away: ${d+n1}/${d} − ${n2}/${d} = ${d+n1-n2}/${d}.`, `So the answer is ${w1-1} and ${d+n1-n2}/${d}.`],
      right:`Yes! ${A} − ${B} = ${fstr(tot, d)}.`});
  }
  // related / unrelated denominators
  const related = kind.startsWith('related'), withWhole = kind.endsWith('Mixed'), sub = kind === 'unrelatedSub';
  let a, b, c, d2;
  if (related){ [b, d2] = pick([[2,4],[2,6],[2,8],[3,6],[4,8],[3,9],[5,10]]); }
  else { [b, d2] = pick([[2,3],[3,4],[2,5],[4,3],[3,2],[4,6],[5,2]]); }
  const D = lcm(b, d2), mb = D/b, md = D/d2;
  if (sub){ do { a = rand(1, b-1); c = rand(1, d2-1); } while (a/b <= c/d2); }
  else { a = rand(1, b-1); c = rand(1, d2-1); }
  const w = withWhole ? 1 : 0, A = w ? `${w} ${a}/${b}` : `${a}/${b}`, B = `${c}/${d2}`;
  const totN = sub ? w*D + a*mb - c*md : w*D + a*mb + c*md;
  const op = sub ? '−' : '+';
  const conv = related ? `Cut each 1/${b} into ${mb} smaller pieces: ${a}/${b} = ${a*mb}/${D}.` : `Cut both cakes into ${D} pieces: ${a}/${b} = ${a*mb}/${D} and ${c}/${d2} = ${c*md}/${D}.`;
  const find = related ? null : `The pieces are different sizes. Find a size both can use. Count in ${b}s: ${Array.from({length:md}, (_,i) => b*(i+1)).join(', ')}. Count in ${d2}s: ${Array.from({length:mb}, (_,i) => d2*(i+1)).join(', ')}. They meet at ${D}.`;
  const sumN = sub ? a*mb - c*md : a*mb + c*md;
  const last = `${a*mb}/${D} ${op} ${c*md}/${D} = ${sumN}/${D}` + (sumN >= D ? ` = 1 ${sumN-D}/${D}` : '') + (w ? `. Then add the whole: 1 + that.` : '.');
  const hints = find ? [find, conv, last] : [`The pieces are different sizes. ${conv}`, last];
  const q = FPAD({text:`${A} ${op} ${B} = ?`, ans:[totN, D], conv:false,
    fig: q => {
      const top = w ? [{g: rowG(mixedPics(1, a, b, PINK)), label:A}] : [{g: shapeG('bar', b, {shade:a, sub: q.conv ? mb : 0}), label:A}];
      if (w && q.conv) top.push({g: shapeG('bar', b, {shade:a, sub: mb}), label:`${a}/${b}`});
      return colSVG([...top, {g: shapeG('bar', d2, {colors: Array.from({length:d2}, (_,i) => i < c ? TEAL : null), sub: q.conv ? md : 0}), label:B}]);
    },
    hints, onHint: k => { if (k === (find ? 2 : 1)) q.conv = true; },
    right:`Yes! ${A} ${op} ${B} = ${fstr(totN, D)}.`});
  return q;
}
function rowG(gs, gap = 12){ let x = 0, s = '', h = 0; gs.forEach(g => { s += `<g transform="translate(${x},0)">${g.inner}</g>`; x += g.w + gap; h = Math.max(h, g.h); }); return {inner:s, w: Math.max(0, x - gap), h}; }

const PNAME2 = {3:'triangle',4:'quadrilateral',5:'pentagon',6:'hexagon',7:'heptagon',8:'octagon',9:'nonagon',10:'decagon',12:'dodecagon'};

/* --- crossing lines picture (vertically opposite angles) --- */
function crossSVG(x, mark, done){
  const L = 120; let s = '';
  s += `<path d="${wedgeD(0,0,40,0,x)}" fill="${PINK}" opacity=".45"/><path d="${arcD(0,0,40,0,x)}" fill="none" stroke="${PINK}" stroke-width="3"/>`;
  const m0 = mark === 'opp' ? 180 : x, m1 = mark === 'opp' ? 180 + x : 180;
  s += `<path d="${wedgeD(0,0,40,m0,m1)}" fill="${TEAL}" opacity=".45"/><path d="${arcD(0,0,40,m0,m1)}" fill="none" stroke="${TEAL}" stroke-width="3"/>`;
  [0, x].forEach(a => { const e1 = pp(0,0,L,a), e2 = pp(0,0,L,a+180); s += `<line x1="${f(e1[0])}" y1="${f(e1[1])}" x2="${f(e2[0])}" y2="${f(e2[1])}" class="ray"/>`; });
  const l1 = pp(0,0,62,x/2), l2 = pp(0,0,62,(m0+m1)/2), ans = mark === 'opp' ? x : 180 - x;
  s += `<text x="${f(l1[0])}" y="${f(l1[1])}" class="lbl" text-anchor="middle" dominant-baseline="middle">${x}°</text>`;
  s += `<text x="${f(l2[0])}" y="${f(l2[1])}" class="lbl" text-anchor="middle" dominant-baseline="middle">${done ? ans + '°' : '?'}</text><circle r="5" class="vdot"/>`;
  return `<svg viewBox="-135 -135 270 270" role="img" aria-label="Two crossing lines">${s}</svg>`;
}

/* ---------------- Angle games ---------------- */
function mWords(){
  const kind = ['classify','pair','classify','vert','pair','classify'][G.i];
  if (kind === 'classify'){
    const types = ['acute','right','obtuse','straight','reflex'];
    let t; do { t = pick(types); } while (t === G.lastType); G.lastType = t;
    const deg = t === 'acute' ? rand(78,88) : t === 'right' ? 90 : t === 'obtuse' ? pick([rand(92,100), rand(170,178)]) : t === 'straight' ? 180 : pick([rand(182,195), rand(330,350)]);
    return {type:'classify', text:'Look very closely. What kind of angle is this?', target:t, deg, rot: randStep(0,345,15), types, bench:false, hints:1};
  }
  if (kind === 'pair'){
    const sort = pick(['comp','supp','none']);
    let x, y;
    if (sort === 'comp'){ x = randStep(15,75,5); y = 90 - x; }
    else if (sort === 'supp'){ x = randStep(20,160,5); y = 180 - x; }
    else { x = randStep(20,100,5); do { y = randStep(15,120,5); } while (x + y === 90 || x + y === 180); }
    const opts = ['Complementary', 'Supplementary', 'Neither'], a = {comp:0, supp:1, none:2}[sort];
    const q = MCQ({text:`Are ${x}° and ${y}° complementary, supplementary, or neither?`, opts, a, showSum:false,
      fig: q => wedgesSVG({parts:[{deg:x, label:x+'°'}, {deg:y, label:y+'°'}], total:{label: q.showSum || q.done ? (x+y)+'°' : '?'}}),
      hint:'<p>Complementary angles add up to 90° (a right angle). Supplementary angles add up to 180° (a straight line). Add the two angles.</p>',
      onHint: () => { q.showSum = true; }, onWrong: () => { q.showSum = true; },
      wrong: () => `Not this one. ${x} + ${y} = ${x+y}.`, right: `Yes! ${x}° + ${y}° = ${x+y}°, so they are ${opts[a].toLowerCase()}.`});
    return q;
  }
  const x = randStep(25,155,5), mark = pick(['opp','adj']), ans = mark === 'opp' ? x : 180 - x;
  return PADQ({text:'Two straight lines cross. What is the angle marked with ?', ans,
    fig: q => crossSVG(x, mark, q.done),
    hints: mark === 'opp' ? ['Look at the two angles opposite each other at the crossing.', 'Opposite angles at a crossing are always equal. They are called vertically opposite angles.'] : ['The pink angle and the green angle sit side by side on one straight line.', 'Angles on a straight line add up to 180°.', `180 − ${x} = ?`],
    right: mark === 'opp' ? `Yes! Vertically opposite angles are equal: ${x}°.` : `Yes! ${x}° + ${ans}° = 180°.`});
}
function mEstimate(){
  let t; do { t = randStep(10,350,5); } while (t > 340);
  const cand = [-3,-2,-1,1,2,3].map(k => t + k*10).filter(v => v >= 5 && v <= 355);
  const opts = shuffle(cand).slice(0,3).concat(t).sort((a,b) => a-b);
  return {type:'estimate', text:'Master Mind: about how big is this angle? The answers are only 10° apart.', deg:t, rot: randStep(0,345,15), opts, ghost:null, bench:false, hints:1};
}
function mMissing(){
  const kind = ['isoApex','isoBase','double','isoApex','big','isoBase'][G.i];
  if (kind === 'isoApex' || kind === 'isoBase'){
    const b = rand(32,70), apex = 180 - 2*b;
    const angs = [b, b, apex];
    if (kind === 'isoApex') return PADQ({text:`This triangle has two equal angles at the bottom (same color). The top angle is ${apex}°. How big is each bottom angle?`, ans:b,
      fig: q => triSVG(angs, -1, true, false, {labels:[q.done ? b+'°' : '?', q.done ? b+'°' : '?', apex+'°'], cols:[TEAL, TEAL, GOLD]}),
      hints:['The two bottom angles are equal. This is called an isosceles triangle.', `All three add up to 180°. Take away the top: 180 − ${apex} = ${180-apex}.`, `That is shared by 2 equal angles: ${180-apex} ÷ 2 = ?`],
      right:`Yes! (180 − ${apex}) ÷ 2 = ${b}°.`});
    return PADQ({text:`The two bottom angles are equal (same color). One of them is ${b}°. What is the top angle?`, ans:apex,
      fig: q => triSVG(angs, -1, true, false, {labels:[b+'°', '', q.done ? apex+'°' : '?'], cols:[TEAL, TEAL, GOLD]}),
      hints:[`The other bottom angle is also ${b}°.`, `Both bottom angles together: ${b} + ${b} = ${2*b}.`, `180 − ${2*b} = ?`], right:`Yes! 180 − ${2*b} = ${apex}°.`});
  }
  if (kind === 'double'){
    const x = rand(15,45), c = 180 - 3*x, angs = shuffle([x, 2*x, c]);
    const labels = angs.map(v => v === c ? c+'°' : v === x ? 'x' : '2x');

/* ---------- the stable scene ---------- */
const FRIEND_SPOTS = [[1,3],[15,3],[70,3],[84,3],[1,30],[84,30],[14,28],[71,28]];
const TOY_SPOTS = {ball:{l:30,b:1,w:10}, top:{l:41,b:1,w:9}, bubbles:{l:51,b:1,w:9}, musicbox:{l:60,b:1,w:10}, kite:{l:80,t:3,w:12}, telescope:{l:3,t:6,w:12}, yoyo:{l:22,t:0,w:9}};
function renderScene(){
  const sc = $('#scene'); if (!sc) return;
  const fr = FRIENDS_SHOP.filter(x => owned(x.id)), toys = TOYS.filter(x => owned(x.id));
  let h = placeSVG(S.place || 'meadow', 'scene-bg');
  if (owned('trampoline')) h += `<button class="toy tramp" data-toy="trampoline" aria-label="Trampoline">${toySVG('trampoline')}</button>`;
  h += `<button class="pet uni-wrap scene-uni${owned('trampoline') ? ' on-tramp' : ''}" id="petUni" aria-label="Pet ${esc(S.uname)}">${unicorn('happy')}</button>`;
  fr.forEach((x,i) => { const [l,b] = FRIEND_SPOTS[i % FRIEND_SPOTS.length]; h += `<button class="friend uni-wrap" data-friend="${x.id}" style="left:${l}%;bottom:${b}%" aria-label="${esc(x.name)}">${friendSVG(x.id)}</button>`; });
  toys.filter(x => x.id !== 'trampoline').forEach(x => { const p = TOY_SPOTS[x.id]; h += `<button class="toy t-${x.id}" data-toy="${x.id}" style="left:${p.l}%;${p.t != null ? `top:${p.t}%` : `bottom:${p.b}%`};width:${p.w}%" aria-label="${esc(x.name)}">${toySVG(x.id)}</button>`; });
  sc.innerHTML = h;
  $('#petUni').onclick = petStable;
  sc.querySelectorAll('[data-friend]').forEach(b => b.addEventListener('click', () => {
    const F = FRIENDS_SHOP.find(x => x.id === b.dataset.friend); move(b, 'hop'); hearts(b, 1);
    const l = `${F.name.split(' ')[0]}: “${pick(F.lines)}”`; $('#say').textContent = l; if (S.sound) speak(l);
  }));
  sc.querySelectorAll('[data-toy]').forEach(b => b.addEventListener('click', () => playToy(b.dataset.toy, b)));
}
function playToy(id, el){
  const say = t => { $('#say').textContent = t; };
  const anim = cls => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); setTimeout(() => el.classList.remove(cls), 1600); };
  if (id === 'trampoline'){ const u = $('#petUni'); u.classList.remove('bounce'); void u.offsetWidth; u.classList.add('bounce'); setTimeout(() => u.classList.remove('bounce'), 1300); say(`Boing! ${S.uname} bounces up high.`); return; }
  if (id === 'ball'){ anim('bounce-toy'); say('Bounce, bounce! The ball rolls a full 360° turn.'); return; }
  if (id === 'kite'){ anim('flutter'); say('Whoosh! The kite dances in the wind.'); return; }
  if (id === 'top'){ anim('spin'); say('Spin, spin! That is a lot of 360° turns.'); return; }
  if (id === 'yoyo'){ anim('yo'); say('Down and up! The yo-yo goes all the way down and comes back.'); return; }
  if (id === 'bubbles'){
    say('Bubbles everywhere! Pop!');
    if (S.calm) return;
    const sc = $('#scene');
    for (let i=0;i<7;i++){ const b = document.createElement('span'); b.className = 'bubble-fx'; b.style.left = (40 + Math.random()*30) + '%'; b.style.bottom = '12%'; b.style.width = b.style.height = (10 + Math.random()*16) + 'px'; b.style.animationDelay = (i*0.12) + 's'; sc.appendChild(b); setTimeout(() => b.remove(), 2600); }
    return;
  }
  if (id === 'musicbox'){
    say(S.sound ? 'La la la! A little tune from the music box.' : 'La la la! (Turn on sound in Grown-up settings to hear the tune.)');
    const sc = $('#scene');
    if (!S.calm) for (let i=0;i<4;i++){ const n = document.createElement('span'); n.className = 'note-fx'; n.textContent = i % 2 ? '♪' : '♫'; n.style.right = (14 + i*6) + '%'; n.style.bottom = '18%'; n.style.animationDelay = (i*0.2) + 's'; sc.appendChild(n); setTimeout(() => n.remove(), 2400); }
    if (S.sound) tune();
    return;
  }
  if (id === 'telescope'){
    say('Look! A shooting star. Make a wish!');
    if (S.calm) return;
    const s = document.createElement('span'); s.className = 'star-fx'; $('#scene').appendChild(s); setTimeout(() => s.remove(), 1800);
  }
}
function tune(){
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = actx.currentTime;
    [523, 659, 784, 659, 698, 880, 784].forEach((fq, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), t = t0 + i*0.22;
      o.type = 'triangle'; o.frequency.value = fq;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.08, t+.02); g.gain.exponentialRampToValueAtTime(.001, t+.4);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t+.45);
    });
  } catch(e) {}
}

let shopTab = 'wear', confirmBuy = null;

  if (tab === 'wear') return WEAR.map(w => ({id:w.id, name:w.name, price:w.price, pic: (PREVIEW = [w.id], (() => { const s = unicorn('happy'); PREVIEW = null; return s; })())}));
  if (tab === 'mane') return MANES.map((m,i) => ({id:'mane'+i, name:m.name + ' mane', price: MANE_PRICE[i] ?? 15, pic:`<span class="sw big">${m.c.map(c => `<i style="background:${c}"></i>`).join('')}</span>`}));
  if (tab === 'friend') return FRIENDS_SHOP.map(x => ({id:x.id, name:x.name, price:x.price, pic: friendSVG(x.id)}));
  if (tab === 'place') return PLACES.map(x => ({id:x.id, name:x.name, price:x.price, pic: placeSVG(x.id)}));

function itemState(tab, it){
  if (!owned(it.id) && it.price > 0) return S.gems >= it.price ? {label: confirmBuy === it.id ? `Yes, buy for ${it.price}` : `Buy for ${it.price}`, act:'buy', cls: confirmBuy === it.id ? 'primary' : ''} : {label:`${it.price - S.gems} more gems`, act:null};
  if (tab === 'wear'){ const on = S.wear[slotOf(it.id)] === it.id; return {label: on ? 'Take off' : 'Wear', act:'wear', cls: on ? 'on' : ''}; }
  if (tab === 'mane'){ const on = 'mane' + S.mane === it.id; return {label: on ? 'Wearing it' : 'Use', act: on ? null : 'mane', cls: on ? 'on' : ''}; }
  if (tab === 'place'){ const on = (S.place || 'meadow') === it.id; return {label: on ? 'You are here' : 'Go here', act: on ? null : 'place', cls: on ? 'on' : ''}; }
  return {label:'In the stable', act:null, cls:'on'};
}
function renderShop(){
  const tabs = $('#shopTabs'); tabs.innerHTML = '';
  SHOP_TABS.forEach(([id, label]) => { const b = document.createElement('button'); b.className = 'tab' + (id === shopTab ? ' on' : ''); b.textContent = label; b.setAttribute('aria-pressed', id === shopTab);
    b.addEventListener('click', () => { shopTab = id; confirmBuy = null; renderShop(); }); tabs.appendChild(b); });
  $('#wallet').textContent = `You have ${S.gems} gems. Things you buy are yours to keep forever.`;
  const box = $('#shopItems'); box.innerHTML = '';
  shopItems(shopTab).forEach(it => {
    const st = itemState(shopTab, it), card = document.createElement('div');
    card.className = 'item' + (owned(it.id) || it.price === 0 ? ' owned' : '') + (shopTab === 'place' ? ' wide' : '');
    card.innerHTML = `<div class="ipic">${it.pic}</div><p class="iname">${esc(it.name)}</p><button class="btn small ${st.cls || ''}"${st.act ? '' : ' disabled'}>${esc(st.label)}</button>`;
    card.querySelector('button').addEventListener('click', () => shopAct(shopTab, it, st.act));

}
function shopAct(tab, it, act){
  if (!act) return;
  const name = it.name.toLowerCase();
  if (act === 'buy'){
    if (confirmBuy !== it.id){ confirmBuy = it.id; renderShop(); return; }
    if (S.gems < it.price) return;
    S.gems -= it.price; S.owned.push(it.id); confirmBuy = null;
    if (tab === 'wear') S.wear[slotOf(it.id)] = it.id;
    if (tab === 'mane') S.mane = +it.id.slice(4);
    if (tab === 'place') S.place = it.id;
    save(); updateGems(false); renderStable(); renderShop();
    const lines = {wear:`I love my new ${name}! Thank you, ${S.kid}.`, mane:`My new ${name} is so pretty!`, friend:`${it.name.split(' ')[0]} moved into the stable! Tap them to say hi.`, place:`Wow, we are at the ${name}!`, toy:`A ${name}! Tap it to play.`};
    $('#say').textContent = lines[tab]; move($('#petUni'), 'hop'); hearts($('#petUni'), 3);
    return;
  }
  if (act === 'wear'){ const sl = slotOf(it.id); if (S.wear[sl] === it.id){ delete S.wear[sl]; $('#say').textContent = `Okay, I took off the ${name}.`; } else { S.wear[sl] = it.id; $('#say').textContent = `I love my ${name}!`; } }
  if (act === 'mane'){ S.mane = +it.id.slice(4); $('#say').textContent = `My ${name} looks great!`; }
  if (act === 'place'){ S.place = it.id; $('#say').textContent = `Let's go to the ${name}!`; }
  save(); renderStable(); renderShop(); move($('#petUni'), 'hop');
}

/* ===================================================================
   THEME 3: Nova's Number Workshop (rounding, subtracting across zeros, decimals)
   =================================================================== */
const LV4 = () => Math.max(0, ['basic','medium','advanced','master'].indexOf(G.level));
function fmtNum(v, dec = 0, money = false){
  const neg = v < 0, s = Math.abs(v).toFixed(dec), [i, d] = s.split('.');
  const ii = i.length > 3 ? i.replace(/\B(?=(\d{3})+(?!\d))/g, ',') : i;
  return (neg ? '−' : '') + (money ? '$' : '') + ii + (d !== undefined ? '.' + d : '');
}
function smartNum(v, money = false, maxDec = 4){
  if (money) return fmtNum(v, Math.abs(v - Math.round(v)) < 1e-9 ? 0 : 2, true);
  for (let d = 0; d <= maxDec; d++) if (Math.abs(Math.round(v * 10**d) - v * 10**d) < 1e-7) return fmtNum(v, d);
  return fmtNum(v, maxDec);
}
const PLACE = {
  ten:{K:10, name:'ten'}, hundred:{K:100, name:'hundred'}, thousand:{K:1000, name:'thousand'}, tenthousand:{K:10000, name:'ten thousand'},
  whole:{K:1, name:'whole number'}, dollar:{K:1, name:'dollar', money:true}, tenth:{K:0.1, name:'tenth'}, hundredth:{K:0.01, name:'hundredth'},
};

/* ---------- Rounding Hills ---------- */
/* spec: value v (real), place key, dec = digits shown for the number */
function hillQ(v, placeKey, dec, opts = {}){
  const P = PLACE[placeKey], money = !!P.money;
  const s = 10 ** Math.max(dec, 0), N = Math.round(v * s), K = Math.round(P.K * s);
  const L = Math.floor(N / K) * K, R = L + K, H = L + K/2, ans = N >= H ? R : L;
  const decK = P.K >= 1 ? 0 : Math.round(-Math.log10(P.K));
  const f1 = x => fmtNum(x / s, dec, money), fp = x => fmtNum(x / s, decK, money), fh = x => smartNum(x / s, money);
  const q = {type:'hill', N, s, K, L, R, H, ans, f1, fp, fh, place: P.name, money, findPosts: !!opts.findPosts, showHalf: !!opts.showHalf, hintStep:0,
    phase: opts.findPosts ? 'posts' : 'pick', text: `Round ${f1(N)} to the nearest ${P.name}.`};
  if (q.findPosts){
    const pairs = [[L, R]];
    if (K >= 10){ const K2 = K/10, Lf = Math.floor(N/K2)*K2; if (Lf !== L) pairs.push([Lf, Lf + K2, true]); }
    pairs.push([L + K, R + K]); if (L - K >= 0) pairs.push([L - K, L]);
    const lab = p => p[2] ? `${fh(p[0])} and ${fh(p[1])}` : `${fp(p[0])} and ${fp(p[1])}`;
    q.postOpts = shuffle(pairs.slice(0, 3).map(p => ({label: lab(p), ok: p[0] === L && p[1] === R && !p[2]})));
    q.hints = [`Rounding to the nearest ${P.name} means landing on a ${P.name} post. Which two ${P.name} posts is ${f1(N)} between? One is just below it and one is just above it.`,
               `${f1(N)} is bigger than ${fp(L)} and smaller than ${fp(R)}.`];
  } else q.hints = pickHints(q);
  return q;
}
function pickHints(q){
  const where = q.N < q.H ? 'before the hilltop' : q.N === q.H ? 'exactly on the hilltop' : 'past the hilltop';
  return [`The hilltop is halfway between the posts: ${q.fh(q.H)}.`, `${q.f1(q.N)} is ${where}.`,
          q.N === q.H ? 'Exactly halfway always rounds UP to the bigger post.' : `So ${S.uname} slides down to ${q.fp(q.ans)}.`];
}
function hillFig(q){
  const X0 = 40, X1 = 320, BY = 172, PK = 70, C = 2*PK - BY;
  const at = t => [X0 + (X1-X0)*t, (1-t)**2*BY + 2*(1-t)*t*C + t*t*BY];
  const known = q.phase !== 'posts' || q.done;
  let s = `<path d="M${X0} ${BY} Q180 ${C} ${X1} ${BY} Z" fill="#B7E3A8" stroke="#7FC07A" stroke-width="3"/><line x1="10" y1="${BY}" x2="350" y2="${BY}" stroke="#7FC07A" stroke-width="4" stroke-linecap="round"/>`;
  for (let k=1; k<10; k++){ const [x,y] = at(k/10); s += `<circle cx="${f(x)}" cy="${f(y)}" r="${k === 5 ? 4.5 : 3}" fill="${k === 5 ? '#F5B04C' : '#5FAE5A'}"/>`; }
  const post = (x, label) => `${RAINBOW.map((c,i) => `<rect x="${x-4}" y="${BY-96+i*16}" width="8" height="16" fill="${c}"/>`).join('')}<rect x="${x-34}" y="${BY-126}" width="68" height="30" rx="9" fill="var(--surface)" stroke="var(--accent)" stroke-width="2.5"/><text x="${x}" y="${BY-111}" class="lbl" style="font-size:${label.length > 6 ? 13 : 17}px" text-anchor="middle" dominant-baseline="middle">${label}</text>`;
  s += post(X0, known ? q.fp(q.L) : '?') + post(X1, known ? q.fp(q.R) : '?');
  if (known && (q.showHalf || q.done)){ s += `<line x1="180" y1="${PK-4}" x2="180" y2="${BY}" stroke="#F5B04C" stroke-width="2.5" stroke-dasharray="6 5"/><text x="180" y="${BY+20}" class="lbl" style="font-size:13px;fill:var(--muted)" text-anchor="middle">halfway ${q.fh(q.H)}</text>`; }
  const t = Math.max(0, Math.min(1, (q.N - q.L) / q.K));
  let [nx, ny] = at(t);
  if (q.done){ nx = q.ans === q.L ? X0 + 34 : X1 - 34; ny = BY; }
  s += unicorn(q.done ? 'happy' : 'plain').replace('<svg ', `<svg x="${f(nx-31)}" y="${f(ny-50)}" width="62" height="52" style="width:62px;height:52px" `);
  const lab = q.f1(q.N), lw = Math.max(54, lab.length * 10 + 14);
  s += `<rect x="${f(nx - lw/2)}" y="${f(ny-84)}" width="${lw}" height="28" rx="9" fill="${PINK}"/><text x="${f(nx)}" y="${f(ny-70)}" class="lbl" style="font-size:16px;fill:#fff" text-anchor="middle" dominant-baseline="middle">${lab}</text>`;
  return `<svg viewBox="0 30 360 168" role="img" aria-label="Rounding hill">${s}</svg>`;
}
function renderHillAnswers(box, q){
  const mk = (html, fn, cls = '') => { const b = document.createElement('button'); b.className = 'opt ' + cls; b.innerHTML = html; b.addEventListener('click', () => fn(b)); box.appendChild(b); return b; };
  if (q.phase === 'posts'){
    q.postOpts.forEach(o => mk(esc(o.label), b => {
      if (q.done) return;
      if (o.ok){
        q.phase = 'pick'; q.hints = pickHints(q); q.hintStep = 0;
        $('#hintbox').innerHTML = ''; $('#hintbox').hidden = true; $('#hintBtn').disabled = false;
        renderFigure(); renderAnswers();
        setBubble(`Yes! ${q.f1(q.N)} is between ${q.fp(q.L)} and ${q.fp(q.R)}. Now: which post is closer?`, false, 'plain');
      } else { q.tries++; b.classList.add('no'); b.disabled = true; while (q.hintStep < Math.min(q.tries, q.hints.length)) showHint(); setBubble(`Not those posts. ${q.f1(q.N)} has to be between them.`, false, 'think'); }
    }));

  }

    if (q.done) return;
    if (p === q.ans){ b.classList.add('yes'); correct(`Yes! ${q.f1(q.N)} rounds to ${q.fp(q.ans)}.` + (q.N === q.H ? ' It was exactly halfway, so it rounds up.' : '')); return; }
    q.tries++; b.classList.add('no'); b.disabled = true; q.showHalf = true; renderFigure();
    while (q.hintStep < Math.min(q.tries, q.hints.length)) showHint();
    const dL = q.fh(q.N - q.L), dR = q.fh(q.R - q.N);
    setBubble(q.N === q.H ? `${q.f1(q.N)} is exactly halfway. The rule: exactly halfway rounds UP to ${q.fp(q.R)}.` : `${q.f1(q.N)} is ${dL} away from ${q.fp(q.L)} and ${dR} away from ${q.fp(q.R)}. Pick the closer post.`, false, 'think');
  }));
}
function genRound(){
  const L = LV4();
  if (L === 0){
    const kind = ['two','three','half','two','three','four'][G.i];
    let v; if (kind === 'two'){ do { v = rand(11, 98); } while (v % 10 === 0); }
    else if (kind === 'three'){ do { v = rand(101, 989); } while (v % 10 === 0); }
    else if (kind === 'half') v = rand(1, 98) * 10 + 5; else { do { v = rand(1001, 9989); } while (v % 10 === 0); }
    return hillQ(v, 'ten', 0, {showHalf:true});
  }
  if (L === 1){
    const kind = ['hundred','hundred','thousand','halfH','thousand','tenthou'][G.i];
    let v, p;
    if (kind === 'hundred'){ p = 'hundred'; do { v = rand(110, 9890); } while (v % 100 === 0); }
    else if (kind === 'halfH'){ p = 'hundred'; v = rand(1, 98) * 100 + 50; }
    else if (kind === 'thousand'){ p = 'thousand'; do { v = rand(1100, 98900); } while (v % 1000 === 0); }
    else { p = 'tenthousand'; do { v = rand(11000, 989000); } while (v % 10000 === 0); }
    return hillQ(v, p, 0, {findPosts:true, showHalf:true});
  }
  if (L === 2){
    const kind = ['whole','tenth','dollar','hundredth','tenth','whole'][G.i];
    if (kind === 'whole'){ let v; do { v = rand(101, 2999) / 100; } while (Math.round(v*100) % 100 === 0); return hillQ(v, 'whole', 2, {findPosts:true}); }
    if (kind === 'tenth'){ let v; do { v = rand(101, 9999) / 100; } while (Math.round(v*100) % 10 === 0); return hillQ(v, 'tenth', 2, {findPosts:true}); }
    if (kind === 'dollar'){ let v; do { v = rand(101, 4999) / 100; } while (Math.round(v*100) % 100 === 0); return hillQ(v, 'dollar', 2, {findPosts:true}); }
    let v; do { v = rand(1001, 9999) / 1000; } while (Math.round(v*1000) % 10 === 0); return hillQ(v, 'hundredth', 3, {findPosts:true});
  }
  const kind = ['big','nines','est','hundredth','nines','est'][G.i];
  if (kind === 'big'){ if (Math.random() < 0.5){ let v; do { v = rand(100000, 999999); } while (v % 1000 === 0); return hillQ(v, 'thousand', 0, {findPosts:true}); } let v; do { v = rand(100000, 999999); } while (v % 10000 === 0); return hillQ(v, 'tenthousand', 0, {findPosts:true}); }
  if (kind === 'nines'){
    const c = pick(['tenth','hund','dollar','tenth']);
    if (c === 'tenth') return hillQ(rand(1, 19) + pick([0.96, 0.97, 0.98, 0.95]), 'tenth', 2, {findPosts:true});
    if (c === 'dollar') return hillQ(rand(1, 19) + pick([0.5, 0.51, 0.49, 0.99]), 'dollar', 2, {findPosts:true});
    return hillQ(rand(1, 9) * 1000 + pick([950, 960, 970, 980, 949]), 'hundred', 0, {findPosts:true});
  }
  if (kind === 'hundredth'){ let v; do { v = rand(1001, 19999) / 1000; } while (Math.round(v*1000) % 10 === 0); return hillQ(v, 'hundredth', 3, {findPosts:true}); }
  const e = pick(['sumH', 'diffW', 'money', 'sumT']);
  let a, b, c = null, place, text, ra, rb, rc = 0, ans, op = '+';
  if (e === 'sumH'){ a = rand(101, 949); b = rand(101, 949); place = 100; text = `Estimate ${a} + ${b} by rounding each number to the nearest hundred first.`; }
  else if (e === 'sumT'){ a = rand(1100, 8900); b = rand(1100, 8900); place = 1000; text = `Estimate ${fmtNum(a)} + ${fmtNum(b)} by rounding each number to the nearest thousand first.`; }
  else if (e === 'diffW'){ a = rand(51, 199) / 10; b = rand(11, Math.floor(a*10) - 20) / 10; op = '−'; place = 1; text = `Estimate ${a} − ${b} by rounding each number to the nearest whole number first.`; }
  else { a = rand(101, 999) / 100; b = rand(101, 999) / 100; c = rand(101, 499) / 100; place = 1; text = `Estimate $${a.toFixed(2)} + $${b.toFixed(2)} + $${c.toFixed(2)} by rounding each price to the nearest dollar first.`; }
  const r = x => Math.floor(x / place + 0.5 + 1e-9) * place;
  ra = r(a); rb = r(b); if (c !== null) rc = r(c);
  ans = op === '+' ? ra + rb + rc : ra - rb;
  const parts = [ra, rb, ...(c !== null ? [rc] : [])].map(x => fmtNum(x));

      hints:[`The two long sides use ${w} + ${w} = ${2*w} ${M}.`, `That leaves ${2*(w+h)} − ${2*w} = ${2*h} ${M} for the two short sides.`, `${2*h} ÷ 2 = ?`], right:`Yes! The width is ${h} ${M}.`});
  }
  if (L === 2){
    const kind = ['lArea','lPer','fenceStory','lArea','tiles','lPer'][G.i];
    const W = rand(6, 12), H = rand(5, 10), cw = rand(2, W - 3), ch = rand(2, H - 3);
    if (kind === 'lArea'){ const A = W*H - cw*ch;
      const q = PADQ({text:`What is the area of this L-shaped paddock?`, ans: A, unit:' ' + M2, split:false,
        fig: q => lFig(W, H, cw, ch, {top: W-cw, notchV: ch, notchH: cw, right: H-ch, bottom: W, left: H}, q.split || q.done),
        hints:['Split the L into two rectangles. I colored them.', `Pink: ${W-cw} × ${H} = ${(W-cw)*H}. Green: ${cw} × ${H-ch} = ${cw*(H-ch)}.`, `${(W-cw)*H} + ${cw*(H-ch)} = ?`],
        onHint: () => { q.split = true; }, right:`Yes! The area is ${A} ${M2}.`}); return q; }
    if (kind === 'lPer') return PADQ({text:`How long is the fence around this L-shaped paddock? Two sides are not labeled.`, ans: 2*(W+H), unit:' ' + M,
      fig: () => lFig(W, H, cw, ch, {top:'?', notchV: ch, notchH: cw, right:'?', bottom: W, left: H}),
      hints:[`The top side is the bottom minus the notch: ${W} − ${cw} = ${W-cw}.`, `The right side is the left minus the notch: ${H} − ${ch} = ${H-ch}.`, `Add all six sides: ${W-cw} + ${ch} + ${cw} + ${H-ch} + ${W} + ${H}.`], right:`Yes! The fence is ${2*(W+H)} ${M}.`});
    const w = rand(5, 15), h = rand(3, 10);
    if (kind === 'fenceStory'){ const posts = 2*(w+h);
      return PADQ({text:`${U}'s garden is ${w} ${M} by ${h} ${M}. She puts a fence all the way around, but leaves a ${2} ${M} gap for a gate. How much fence does she need?`, ans: posts - 2, unit:' ' + M, fig: () => rectFig(w, h, {lw:`${w} ${M}`, lh:`${h} ${M}`}),
        hints:[`The whole way around is ${w} + ${h} + ${w} + ${h} = ${posts} ${M}.`, `Take away the gate: ${posts} − 2 = ?`], right:`Yes! ${posts} − 2 = ${posts - 2} ${M} of fence.`}); }
    return PADQ({text:`Grass tiles are 1 ${M} by 1 ${M}. How many tiles cover a paddock that is ${w} ${M} by ${h} ${M}?`, ans: w*h, unit:' tiles', fig: () => rectFig(w, h, {grid:true, lw:`${w} ${M}`, lh:`${h} ${M}`}),
      hints:['Each tile covers 1 square of area.', `${w} × ${h} = ?`], right:`Yes! ${w*h} tiles.`});
  }
  const kind = ['dec','tri','hole','compare','square','tri'][G.i];
  if (kind === 'dec'){ const w = pick([2.5, 3.5, 4.5, 1.5]), h = pick([2, 4, 6, 3]), A = w*h;
    return PADQ({text:`A flower bed is ${w} ${M} by ${h} ${M}. What is its area?`, ans: A, decimal:true, unit:' ' + M2, ansEntry: String(A), ansText: String(A), fig: () => rectFig(w, h, {lw:`${w} ${M}`, lh:`${h} ${M}`}),
      hints:['Area = length × width, even with decimals.', `${w} × ${h}: first ${Math.floor(w)} × ${h} = ${Math.floor(w)*h}, then 0.5 × ${h} = ${h/2}.`, `${Math.floor(w)*h} + ${h/2} = ?`], right:`Yes! ${w} × ${h} = ${A} ${M2}.`}); }
  if (kind === 'tri'){ const b = pick([4, 6, 8, 10, 12]), h = rand(3, 9), A = b*h/2;
    return PADQ({text:`A triangle-shaped garden has a base of ${b} ${M} and a height of ${h} ${M}. What is its area?`, ans: A, decimal: !Number.isInteger(A), unit:' ' + M2, ansEntry: String(A), ansText: String(A),
      fig: () => rectFig(b, h, {tri: pick([0.3, 0.5, 0.7]), lw:`base ${b} ${M}`, lh:`height ${h} ${M}`}),
      hints:['The triangle fits inside the dashed rectangle. It is exactly half of it.', `The rectangle is ${b} × ${h} = ${b*h}.`, `Half of ${b*h} = ?`], right:`Yes! ${b} × ${h} ÷ 2 = ${A} ${M2}.`}); }
  if (kind === 'hole'){ const w = rand(8, 14), h = rand(6, 10), p = rand(2, Math.min(4, h - 3)), A = w*h - p*p;
    return PADQ({text:`A paddock is ${w} ${M} by ${h} ${M}. It has a square pond, ${p} ${M} by ${p} ${M}. How much grass is there?`, ans: A, unit:' ' + M2,
      fig: () => rectFig(w, h, {hole:p, lw:`${w} ${M}`, lh:`${h} ${M}`, lhole:`${p} by ${p}`}),
      hints:[`The whole paddock: ${w} × ${h} = ${w*h}.`, `The pond: ${p} × ${p} = ${p*p}.`, `Grass = ${w*h} − ${p*p} = ?`], right:`Yes! ${w*h} − ${p*p} = ${A} ${M2} of grass.`}); }
  if (kind === 'compare'){ const P = pick([20, 24, 28, 16]), sd = P/4, w2 = P/2 - 2;
    const opts = shuffle([`${sd} by ${sd}`, `${w2} by 2`, 'They have the same area']);
    return MCQ({text:`Two paddocks both have a ${P} ${M} fence: one is ${sd} by ${sd}, the other is ${w2} by 2. Which has more grass?`, opts, a: opts.indexOf(`${sd} by ${sd}`),
      fig: () => `<div class="two-rects">${rectFig(sd, sd, {lw:sd, lh:sd})}${rectFig(w2, 2, {lw:w2, lh:2})}</div>`,
      hint:`<p>Work out both areas: ${sd} × ${sd} and ${w2} × 2.</p>`, wrong: () => `Compare: ${sd} × ${sd} = ${sd*sd} and ${w2} × 2 = ${w2*2}.`, right:`Yes! ${sd*sd} is more than ${w2*2}. The same fence can hold different amounts of grass.`}); }
  const sd = rand(4, 12);
  return PADQ({text:`A square paddock has an area of ${sd*sd} ${M2}. How long is its fence (the perimeter)?`, ans: 4*sd, unit:' ' + M, fig: () => rectFig(sd, sd, {lw:'?', lh:'?'}),
    hints:[`A square has 4 equal sides. Side × side = ${sd*sd}.`, `Which number times itself makes ${sd*sd}? It is ${sd}.`, `The fence is 4 × ${sd} = ?`], right:`Yes! Each side is ${sd} ${M}, so the fence is ${4*sd} ${M}.`});
}

function startGame(mode, level){
  G = {mode, level, i:0, earned:0, first:0, lastType:null, termsLeft:shuffle(TERMS)};
  G.theme = (GAMES[mode] || {}).theme || 'angles'; curTheme = G.theme;
  $('#lvl').textContent = LEVEL_NAME[level] || level;
  show('game');
  newQuestion();
}

function makeQ(){
  if (NEW_GEN[G.mode]) return NEW_GEN[G.mode]();
  if (G.level === 'master' && MASTER_GEN[G.mode]) return MASTER_GEN[G.mode]();
  if (FRAC_GEN[G.mode]) return FRAC_GEN[G.mode]();
  if (G.mode === 'clock') return makeClockQ();
  if (G.mode === 'poly') return makePolyQ();
  if (G.mode === 'calc') return makeCalcQ();
  const g = G.level === 'gentle';
  if (G.mode === 'estimate'){
    const t = g ? randStep(20,160,10) : randStep(10,175,5);
    const sp = g ? 30 : 20;
    const cand = [-3,-2,-1,1,2,3].map(k=>t+k*sp).filter(v=>v>=10 && v<=180);
    const opts = shuffle(cand).slice(0,3).concat(t).sort((a,b)=>a-b);
    return {type:'estimate', text:'About how big is this angle?', deg:t, rot: g ? 0 : randStep(0,345,15), opts, ghost:null, bench:false, hints:1};
  }
  if (G.mode === 'words'){
    const types = g ? ['acute','right','obtuse','straight'] : ['acute','right','obtuse','straight','reflex'];
    const kind = ['classify','classify','picture','term','classify','picture'][G.i];
    let t; do { t = pick(types); } while (t === G.lastType);
    G.lastType = t;
    if (kind === 'classify'){
      return {type:'classify', text:'What kind of angle is this?', target:t, deg:angleOfType(t), rot: g ? randStep(0,30,10) : randStep(0,345,15), types, bench:false, hints:1};
    }
    if (kind === 'picture'){
      const others = shuffle(types.filter(x=>x!==t)).slice(0,2);
      const opts = shuffle([t, ...others]).map(x => ({type:x, deg:angleOfType(x), rot: g ? 0 : randStep(0,90,15)}));
      return {type:'picture', text:`Tap the ${t} angle.`, target:t, opts, hints:1};
    }
    const term = G.termsLeft.pop();
    return {type:'term', text:term.q, term, hints:1};
  }
  if (G.mode === 'bridge'){
    const kind = ['exact','exact','type','exact','type','exact'][G.i];
    let tgt;
    if (kind === 'type'){
      let t; do { t = pick(['acute','right','obtuse','straight']); } while (t === G.lastType);
      G.lastType = t; tgt = {kind:'type', t};
    } else tgt = {kind:'exact', deg: g ? pick([30,45,60,90,120,135,150]) : randStep(15,170,5)};
    const ref = tgt.kind === 'exact' ? tgt.deg : {acute:45, right:90, obtuse:135, straight:180}[tgt.t];
    const start = ref >= 90 ? randStep(15, ref-45, 5) : randStep(ref+45, 170, 5);
    const text = tgt.kind === 'exact' ? `Drag the pink dot to make a ${tgt.deg}° angle.` : `Drag the pink dot to make ${DEF[tgt.t].a} angle.`;
    return {type:'bridge', text, tgt, cur:start, show:g, reveal:false, tol: g ? 5 : 10, hints:1};
  }
  // missing angle
  let angs;
  if (g){
    let a, b;
    do { a = randStep(30,100,10); b = randStep(30,120,10); } while (180-a-b < 30);
    angs = [a, b, 180-a-b];
  } else if (Math.random() < 0.35){
    const x = rand(20,70); angs = shuffle([90, x, 90-x]);
  } else {
    let a, b;
    do { a = rand(25,110); b = rand(25,110); } while (180-a-b < 22);
    angs = [a, b, 180-a-b];
  }
  const hidden = rand(0,2);
  const known = angs.filter((_,i)=>i!==hidden);
  return {type:'missing', text:'Two angles are shown. What is the missing angle?', angs, hidden, known, sum:known[0]+known[1], ans:angs[hidden], entry:'', hints:3, hintStep:0};
}

function newQuestion(){
  const q = G.q = makeQ();
  q.tries = 0; q.done = false;
  $('#qtext').innerHTML = fmtFr(esc(q.text));
  $('#hintbox').hidden = true; $('#hintbox').innerHTML = '';
  $('#nextBtn').hidden = true;
  $('#hintBtn').hidden = false; $('#hintBtn').disabled = false;
  setBubble(firstLine(q), false, 'plain');
  renderDots(); renderFigure(); renderAnswers();
  if (S.autoread) speak(q.text);
}

function firstLine(q){
  if (q.type === 'hill') return q.phase === 'posts' ? 'First find the two posts the number sits between.' : `Is ${S.uname} closer to the left post or the right post?`;
  if (q.type === 'trade') return 'Tap a block to break it into 10 smaller blocks.';
  if (q.type === 'fence') return 'Tap squares to plant grass. The fence follows the outside.';
  if (q.type === 'padq' && q.decimal) return q.first || 'Use the dot button for the decimal point.';
  if (q.type === 'fpad') return q.first || (q.noWhole ? 'Tap a box, then type the number.' : 'Use the big box for whole numbers and the small boxes for the fraction.');
  if (q.type === 'paint') return 'Tap a piece to color it. Tap it again to take the color away.';
  if (q.type === 'path') return q.show ? `Drag ${S.uname} along the rainbow path, or use the step buttons.` : `Drag ${S.uname} along the path. The number shows after you press Check.`;
  if (q.type === 'balloon') return 'Tap a balloon to pop it. Take your time, they float slowly.';
  if (q.type === 'share') return q.mode === 'fill' ? 'Tap Fill a plate.' : 'Tap a cookie, or the Deal one button.';
  if (q.type === 'mcq') return q.first || 'Take your time.';
  if (q.type === 'picq') return 'Look at all three pictures first.';
  if (q.type === 'padq' && q.first) return q.first;
  if (q.type === 'estimate') return 'Look at the purple part. Is it small, like a corner, or wide open?';
  if (q.type === 'classify') return 'Look at how open the angle is.';
  if (q.type === 'picture') return 'Look at all three pictures first.';
  if (q.type === 'term') return 'Take your time.';
  if (q.type === 'bridge') return q.show ? 'Put your finger on the pink dot and move it. The Smaller and Bigger buttons work too.' : 'The number is hidden. Build the angle by looking, then press Check.';
  return 'Use the number buttons to type your answer.';
}

function renderDots(){

function renderFigure(){
  const q = G.q, fig = $('#figure');
  fig.hidden = false;
  fig.className = 'figure' + (q.type === 'balloon' || q.type === 'share' || q.type === 'trade' ? ' col' : '');
  fig.style.touchAction = q.type === 'path' ? 'none' : '';
  if (q.type !== 'path' && fig._q){ fig._q = null; clearFigHandlers(); }
  if (q.type === 'hill'){ fig.innerHTML = hillFig(q); return; }
  if (q.type === 'trade'){ fig.innerHTML = tradeFig(q); wireTrade(); return; }
  if (q.type === 'fence'){ fig.innerHTML = fenceFig(q); wireFence(); return; }
  if (q.type === 'fpad'){ const h = q.fig ? q.fig(q) : ''; if (h) fig.innerHTML = h; else fig.hidden = true; return; }
  if (q.type === 'paint'){ fig.innerHTML = paintFig(q); wirePaint(); return; }
  if (q.type === 'path'){ fig.innerHTML = pathFig(q); if (fig._q !== q){ fig._q = q; wirePathFig(); } return; }
  if (q.type === 'balloon'){ fig.innerHTML = balloonFig(q); wireBalloons(); return; }
  if (q.type === 'share'){ fig.innerHTML = shareFig(q); wireShare(); return; }
  if (q.type === 'picq' && q.pic){ fig.innerHTML = q.pic; return; }
  if (q.type === 'estimate') fig.innerHTML = angleSVG({deg:q.deg, rot:q.rot, ghost:q.ghost, bench:q.bench, label: q.done ? q.deg+'°' : null});
  else if (q.type === 'classify') fig.innerHTML = angleSVG({deg:q.deg, rot:q.rot, bench:q.bench, label: q.done ? q.deg+'°' : null});
  else if (q.type === 'term'){
    if (q.term.ring) fig.innerHTML = angleSVG({deg:60, rot:10, ring:true});
    else fig.hidden = true;
  }
  else if (q.type === 'picture') fig.hidden = true;
  else if (q.type === 'bridge') buildBridge();
  else if (q.type === 'mcq' || q.type === 'padq'){ const h = q.fig ? q.fig(q) : ''; if (h) fig.innerHTML = h; else fig.hidden = true; }
  else if (q.type === 'picq') fig.hidden = true;
  else fig.innerHTML = triSVG(q.angs, q.hidden, q.done);
}

function renderAnswers(){
  const q = G.q, box = $('#answers');
  box.innerHTML = '';
  const btn = (html, onClick, cls='') => { const b = document.createElement('button'); b.className = 'opt ' + cls; b.innerHTML = html; b.addEventListener('click', () => onClick(b)); box.appendChild(b); return b; };

  if (q.type === 'estimate'){

      else {
        q.tries++; b.classList.add('no'); b.disabled = true; capEl.textContent = cap(o.type);
        setBubble(`That one is ${DEF[o.type].a} angle. It is ${DEF[o.type].short}. Try another picture.`, false, 'think');
      }
    }, 'picbtn'));
  }
  if (q.type === 'term'){
    q.term.opts.forEach((t, i) => btn(t, b => {
      if (q.done) return;
      if (i === q.term.a){ b.classList.add('yes'); correct(`Yes! ${q.term.why}`); }
      else { q.tries++; b.classList.add('no'); b.disabled = true; setBubble('Not this one. Try another answer.', false, 'think'); }
    }));
  }
  if (q.type === 'fpad'){ renderFpad(box, q); }
  if (q.type === 'hill'){ renderHillAnswers(box, q); }
  if (q.type === 'fence'){
    const c = document.createElement('p'); c.className = 'paintcount fencecount'; c.id = 'fenceCount'; box.appendChild(c);
    const wrap = document.createElement('div'); wrap.className = 'paint-ctrls';
    const b1 = document.createElement('button'); b1.className = 'opt'; b1.textContent = 'Clear'; b1.addEventListener('click', () => { if (!q.done){ q.cells.clear(); renderFigure(); updateFenceCount(); } });
    const b2 = document.createElement('button'); b2.className = 'opt yes'; b2.textContent = 'Check'; b2.addEventListener('click', checkFence);
    wrap.append(b1, b2); box.appendChild(wrap); updateFenceCount();
  }
  if (q.type === 'paint'){
    const c = document.createElement('p'); c.className = 'paintcount'; c.id = 'paintCount'; box.appendChild(c);
    const wrap = document.createElement('div'); wrap.className = 'paint-ctrls';
    const b1 = document.createElement('button'); b1.className = 'opt'; b1.textContent = 'Clear'; b1.addEventListener('click', () => { if (!q.done){ q.painted.clear(); renderFigure(); updatePaintCount(); } });
    const b2 = document.createElement('button'); b2.className = 'opt yes'; b2.textContent = 'Check'; b2.addEventListener('click', checkPaint);
    wrap.append(b1, b2); box.appendChild(wrap); updatePaintCount();
  }
  if (q.type === 'path'){
    const wrap = document.createElement('div'); wrap.className = 'bridge-ctrls';
    const mk = (label, fn, cls='') => { const b = document.createElement('button'); b.className = 'opt ' + cls; b.textContent = label; b.addEventListener('click', fn); wrap.appendChild(b); };
    mk('Step back', () => setPos(Math.max(0, q.pos - 1)));
    mk('Step forward', () => setPos(Math.min(q.max*q.den, q.pos + 1)));
    mk('Check', checkPath, 'yes');
    box.appendChild(wrap);
  }
  if (q.type === 'share' && q.phase === 'deal'){
    const wrap = document.createElement('div'); wrap.className = 'deal-ctrls';
    const mk = (label, fn, id) => { const b = document.createElement('button'); b.className = 'opt'; b.textContent = label; if (id) b.id = id; b.addEventListener('click', fn); wrap.appendChild(b); return b; };
    if (q.mode === 'fill'){ mk('Fill a plate', dealOne).style.gridColumn = '1/-1'; }
    else { mk('Deal one', dealOne); mk('Deal the rest', dealRest, 'dealRest'); }
    box.appendChild(wrap); refreshDealBtns();
  }
  if (q.type === 'mcq'){
    q.opts.forEach((t, i) => btn(fmtFr(esc(t)), b => {

      else {
        q.tries++; b.classList.add('no'); b.disabled = true;
        if (q.onWrong) q.onWrong(i);

    q.pics.forEach(o => btn(o.svg + '<span class="cap">&nbsp;</span>', b => {

      else { q.tries++; b.classList.add('no'); b.disabled = true; setBubble(o.why || 'Not this one. Try another picture.', false, 'think'); }
    }, 'picbtn'));
  }
  if (q.type === 'bridge'){
    const wrap = document.createElement('div'); wrap.className = 'bridge-ctrls';
    const mk = (label, fn, cls='') => { const b = document.createElement('button'); b.className = 'opt ' + cls; b.textContent = label; b.addEventListener('click', fn); wrap.appendChild(b); };
    mk('Smaller', () => { if (!q.done) setCur(Math.max(5, q.cur - 5)); });

  if (q.type === 'missing' || q.type === 'padq' || (q.type === 'share' && q.phase === 'ask') || (q.type === 'trade' && q.phase === 'ask')){

    box.appendChild(pad);
    const keys = pad.querySelector('#keys');
    const key = (label, fn, cls='') => { const b = document.createElement('button'); b.className = 'opt ' + cls; b.textContent = label; b.addEventListener('click', fn); keys.appendChild(b); };
    [1,2,3,4,5,6,7,8,9].forEach(n => key(n, () => typeDigit(n)));
    if (q.decimal){
      key('.', () => { if (q.done || q.entry.includes('.')) return; q.entry = (q.entry || '0') + '.'; updatePad(); });
      key('0', () => typeDigit(0));
      key('Delete', () => { if (!q.done){ q.entry = q.entry.slice(0,-1); updatePad(); } });
      const cb = document.createElement('button'); cb.className = 'opt yes fcheck'; cb.textContent = 'Check'; cb.addEventListener('click', checkPad); pad.appendChild(cb);
    } else {
      key('Delete', () => { if (!q.done){ q.entry = q.entry.slice(0,-1); updatePad(); } });
      key('0', () => typeDigit(0));
      key('Check', q.type === 'missing' ? checkMissing : checkPad, 'yes');
    }
    updatePad();
  }
}

/* ---------- Rainbow Bridge: drag to build an angle ---------- */
function buildBridge(){
  const q = G.q, fig = $('#figure');
  fig.innerHTML = `<svg class="bridge" viewBox="-150 -150 300 182" role="img" aria-label="An angle you can change by dragging the pink dot">
    <g id="bRain"></g>
    <path id="bFill" class="ang-fill"/><path id="bArc" class="ang-arc"/>
    <line x1="0" y1="0" x2="125" y2="0" class="ray"/><line id="bArm" x1="0" y1="0" x2="0" y2="0" class="ray"/>
    <circle r="6" class="vdot"/>
    <circle id="bRing" r="30" class="handle-ring"/><circle id="bHandle" r="15" class="handle"/>
    <text id="bLabel" class="lbl" text-anchor="middle" dominant-baseline="middle"></text>
  </svg>`;
  const svg = fig.querySelector('svg');
  let drag = false;
  const toAng = e => {
    const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
    const m = p.matrixTransform(svg.getScreenCTM().inverse());
    let a = Math.atan2(-m.y, m.x) * 180 / Math.PI;
    if (a < 0) a = m.x < 0 ? 180 : 0;
    const st = q.show ? 5 : 1;
    return Math.max(5, Math.min(180, Math.round(a / st) * st));
  };
  svg.addEventListener('pointerdown', e => { if (q.done) return; drag = true; try { svg.setPointerCapture(e.pointerId); } catch(_){} setCur(toAng(e)); });
  svg.addEventListener('pointermove', e => { if (drag && !q.done) setCur(toAng(e)); });
  const stop = () => { drag = false; };
  svg.addEventListener('pointerup', stop); svg.addEventListener('pointercancel', stop);
  updateBridge();
}
function setCur(v){ const q = G.q; if (v === q.cur) return; q.cur = v; if (!q.show) q.reveal = false; updateBridge(); }
function updateBridge(){
  const q = G.q, c = q.cur, e = pp(0,0,125,c), set = (id, attrs) => { const el = document.getElementById(id); if (el) for (const k in attrs) el.setAttribute(k, attrs[k]); };
  set('bArm', {x2:f(e[0]), y2:f(e[1])});
  set('bHandle', {cx:f(e[0]), cy:f(e[1]), visibility: q.done ? 'hidden' : 'visible'});
  set('bRing', {cx:f(e[0]), cy:f(e[1]), visibility: q.done ? 'hidden' : 'visible'});
  if (q.done){ set('bFill', {d:''}); set('bArc', {d:''}); }
  else if (c === 90){ set('bFill', {d:'M0 0 L22 0 L22 -22 L0 -22 Z'}); set('bArc', {d:'M22 0 L22 -22 L0 -22'}); }
  else { set('bFill', {d:wedgeD(0,0,40,0,c)}); set('bArc', {d:arcD(0,0,40,0,c)}); }
  const lp = pp(0,0, q.done ? 30 : 64, c/2);
  set('bLabel', {x:f(lp[0]), y:f(lp[1])});
  const lab = document.getElementById('bLabel');
  if (lab) lab.textContent = (q.show || q.reveal || q.done) ? c + '°' : '';
  const rain = document.getElementById('bRain');
  if (rain) rain.innerHTML = q.done ? RAINBOW.map((col,i) => `<path d="${arcD(0,0,105-i*9,0,c)}" stroke="${col}" stroke-width="9" fill="none"/>`).join('') : '';
}
function bridgeKind(c){ return c >= 178 ? 'straight' : (c >= 88 && c <= 92) ? 'right' : c < 90 ? 'acute' : 'obtuse'; }
function checkBridge(){
  const q = G.q; if (q.done) return;
  const c = q.cur; let ok, msg;
  if (q.tgt.kind === 'exact'){
    ok = Math.abs(c - q.tgt.deg) <= q.tol;
    if (!ok) msg = `Your angle is ${c}°. You need ${q.tgt.label || q.tgt.deg + '°'}. Make it ${c > q.tgt.deg ? 'smaller' : 'bigger'}.`;
  } else {
    const k = bridgeKind(c); ok = k === q.tgt.t;
    if (!ok) msg = `Your angle is ${c}°. That is ${DEF[k].a} angle. ${cap(DEF[q.tgt.t].a)} angle is ${DEF[q.tgt.t].short}.`;
  }
  q.reveal = true; updateBridge();
  if (ok) correct(`Yes! Your angle is ${c}°. ${S.uname} can cross the rainbow bridge!`);
  else { q.tries++; setBubble(msg, false, 'think'); }
}

function typeDigit(n){ const q = G.q; if (q.done || q.entry.length >= 8) return; q.entry += String(n); updatePad(); }
function updatePad(){ const d = $('#padDisplay'); if (d) d.textContent = G.q.entry ? (G.q.pre || '') + G.q.entry + (G.q.unit ?? '°') : '?'; }

function checkPad(){
  const q = G.q; if (q.done || !q.entry) return;
  const v = q.decimal ? parseFloat(q.entry) : parseInt(q.entry, 10), u = q.unit ?? '°', shown = (q.pre || '') + q.entry + u;
  if (Math.abs(v - q.ans) < 1e-6){ correct(q.right); return; }
  q.tries++; q.entry = ''; updatePad();
  while (q.hintStep < Math.min(q.tries, q.hints.length)) showHint();
  const at = q.ansText != null ? q.ansText : (q.pre || '') + q.ans;
  if (q.tries >= 3) setBubble(`${shown} is not it. The answer is ${at}${u}. Type ${q.ansEntry != null ? q.ansEntry : q.ans}.`, false, 'think');
  else setBubble(`${shown} is not it yet. Look at the hint and try again.`, false, 'think');
}

function checkMissing(){
  const q = G.q; if (q.done || !q.entry) return;
  const v = parseInt(q.entry, 10);
  if (v === q.ans){ correct(`Yes! ${q.known[0]}° + ${q.known[1]}° + ${q.ans}° = 180°.`); return; }
  q.tries++; q.entry = ''; updatePad();
  while (q.hintStep < Math.min(q.tries, 3)) showHint();
  if (q.tries >= 3) setBubble(`${v}° is not it. Here is the answer: 180 − ${q.sum} = ${q.ans}. Type ${q.ans}.`, false, 'think');
  else setBubble(`${v}° is not it yet. Look at the hint and try again.`, false, 'think');
}

function showHint(){
  const q = G.q, hb = $('#hintbox');
  hb.hidden = false;
  if (Array.isArray(q.hints) && q.type !== 'missing'){
    if (q.hintStep < q.hints.length){
      const h = q.hints[q.hintStep], t = typeof h === 'string' ? h : h.t;
      hb.innerHTML += `<p><b>Hint ${q.hintStep+1}.</b> ${fmtFr(t)}</p>${typeof h === 'string' ? '' : (h.pic || '')}`;
      q.hintStep++;
      if (q.onHint){ q.onHint(q.hintStep); renderFigure(); }
    }
    if (q.hintStep >= q.hints.length) $('#hintBtn').disabled = true;
    return;
  }
  if (q.type === 'mcq' || q.type === 'picq'){
    $('#hintBtn').disabled = true; hb.innerHTML = fmtFr(q.hint);
    if (q.onHint){ q.onHint(1); renderFigure(); }
    return;
  }
  if (q.type === 'missing'){
    q.hintStep++;
    if (q.hintStep === 1) hb.innerHTML += `<p><b>Hint 1.</b> In every triangle, the three angles add up to 180°. That is the same as a straight line.</p>${lineHintSVG(q.angs, q.hidden)}`;
    if (q.hintStep === 2) hb.innerHTML += `<p><b>Hint 2.</b> Add the two angles you know: ${q.known[0]} + ${q.known[1]} = ${q.sum}.</p>`;
    if (q.hintStep === 3) hb.innerHTML += `<p><b>Hint 3.</b> Take that away from 180: 180 − ${q.sum} = ?</p>`;
    if (q.hintStep >= 3) $('#hintBtn').disabled = true;
    return;
  }
  $('#hintBtn').disabled = true;
  if (q.type === 'estimate'){
    q.bench = true; renderFigure();
    const rel = q.deg < 90 ? 'smaller than' : q.deg > 90 ? 'bigger than' : 'the same as';
    hb.innerHTML = `<p>The grey dashed line makes a right angle: 90°. This angle is ${rel} 90°.</p>`;
  } else if (q.type === 'classify'){
    q.bench = true; renderFigure();
    hb.innerHTML = `<p>The grey dashed line shows 90°. Is the purple part smaller, the same, or bigger? If it goes past a straight line, it is reflex.</p>`;
  } else if (q.type === 'bridge'){
    if (q.tgt.kind === 'exact'){
      const rel = q.tgt.deg < 90 ? 'smaller than' : q.tgt.deg > 90 ? 'bigger than' : 'exactly';
      if (!q.show){ q.show = true; updateBridge(); }
      hb.innerHTML = `<p>${q.tgt.deg}° is ${rel} a right angle (90°). The number now shows while you drag.</p>`;
    } else hb.innerHTML = `<p>${DEF[q.tgt.t].long}</p>`;
  } else if (q.type === 'picture'){
    hb.innerHTML = `<p>${DEF[q.target].long}</p>`;
  } else {
    hb.innerHTML = `<p>${q.term.hint}</p>`;
  }
}

function correct(msg){
  const q = G.q; q.done = true;
  if (q.tries === 0) G.first++;
  const rw = REWARD[G.level] || 1;
  G.earned += rw; S.gems += rw; save();
  updateGems(true, rw);
  const cheer = nextCheer();
  renderFigure();
  if (q.type === 'missing' || q.type === 'padq' || q.type === 'share' || q.type === 'trade') { q.entry = q.ansEntry != null ? String(q.ansEntry) : String(q.ans); updatePad(); }
  if (q.type === 'fence') updateFenceCount();
  if (q.type === 'fpad') updateFpad();
  if (q.type === 'paint') updatePaintCount();
  document.querySelectorAll('#answers button').forEach(b => { if (!b.classList.contains('yes') || ['missing','padq','bridge','fpad','paint','path','share','hill','trade','fence'].includes(q.type)) b.disabled = true; });
  setBubble(msg + (rw === 1 ? ' You earned a gem.' : ` You earned ${rw} gems.`), true, 'happy', cheer);
  if (S.sound) speak(cheer, 1.25);
  $('#hintBtn').hidden = true;
  $('#nextBtn').hidden = false;
  $('#nextBtn').textContent = G.i === N-1 ? 'Finish round' : 'Next question';
  $('#nextBtn').focus();
}

  renderStable();
  renderShop();
  renderAlbumCard();
  $('#albumIco').innerHTML = stickerSVG('fr_balloon', 'master', 0);
  updateGems(false);
}

function renderBook(theme){
  if (theme === 'frac'){ $('#bookList').innerHTML = fracBook().join(''); return; }
  if (theme === 'num'){ $('#bookList').innerHTML = numBook().join(''); return; }
  if (theme === 'area'){ $('#bookList').innerHTML = areaBook().join(''); return; }
  const items = Object.values(DEF).map(d => {
    const deg = {acute:45, right:90, obtuse:130, straight:180, reflex:250}[d.name];
    return `<div class="word">${angleSVG({deg, rot:0, mini:true})}<h3>${cap(d.name)} angle</h3><p>${d.long}</p><p class="hook">${d.hook}</p></div>`;
  });
  items.push(`<div class="word">${angleSVG({deg:60, rot:10, ring:true, mini:true})}<h3>Vertex</h3><p>The corner point where the two arms of an angle meet.</p><p class="hook">The arms are the two straight lines.</p></div>`);
  items.push(`<div class="word">${angleSVG({deg:360-1, rot:0, mini:true}).replace('aria-label="An angle"','aria-label="A full turn"')}<h3>Degrees</h3><p>We measure angles in degrees. A full turn is 360°. Half a turn is 180°.</p><p class="hook">The tiny circle in 90° means degrees.</p></div>`);
  items.push(`<div class="word">${triSVG([60,50,70], -1, true, true)}<h3>Triangle rule</h3><p>The three angles in any triangle add up to 180°.</p><p class="hook">Put the three corners side by side and they make a straight line.</p></div>`);
  items.push(`<div class="word">${clockSVG({h:2, m:0, slices:true})}<h3>Clock angles</h3><p>A clock is a full turn: 360°. It has 12 numbers, so each jump from one number to the next is 30°.</p><p class="hook">3 jumps make a right angle, like at 3:00.</p></div>`);
  items.push(`<div class="word">${polySVG({pts: polyPts(5,0), fan:true, fanLabels:true, arcs:false})}<h3>Shape rule</h3><p>Draw lines from one corner to split a shape into triangles. Each triangle is 180°. Total = (sides − 2) × 180°.</p><p class="hook">Square 360°, pentagon 540°, hexagon 720°.</p></div>`);
  items.push(`<div class="word">${wedgesSVG({parts:[{deg:120,label:''},{deg:60,label:''}], total:{label:'180°'}})}<h3>Lines and points</h3><p>Angles on a straight line add up to 180°. Angles all the way around a point add up to 360°.</p><p class="hook">Half a turn is 180°. A full turn is 360°.</p></div>`);
  $('#bookList').innerHTML = items.join('');
}

function nextCheer(){

let actx;
function chime(){
  if (!S.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime;
    [660, 880, 1320].forEach((fq, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.value = fq;
      g.gain.setValueAtTime(0, t+i*.09); g.gain.linearRampToValueAtTime(.1, t+i*.09+.02); g.gain.exponentialRampToValueAtTime(.001, t+i*.09+.5);
      o.connect(g).connect(actx.destination); o.start(t+i*.09); o.stop(t+i*.09+.55);
    });
  } catch(e) {}
}
function speak(text, pitch){
  try {
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/(\d+) (\d+)\/(\d+)/g, (m,w,n,d) => `${w} and ${frWords(n,d)}`).replace(/(\d+)\/(\d+)/g, (m,n,d) => frWords(n,d)).replace(/°/g,' degrees').replace(/−/g,' minus ').replace(/…/g,' blank.'));
    u.rate = 0.9; if (pitch) u.pitch = pitch; speechSynthesis.speak(u);
  } catch(e) {}
}
